services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      # รหัสผ่าน sa ต้องยาว ≥ 8 ตัว และมีตัวพิมพ์ใหญ่/เล็ก/ตัวเลข/สัญลักษณ์ (ตั้งใน .env)
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set in .env}
    ports:
      - "1433:1433"
    volumes:
      # ข้อมูลอยู่ใน volume เพื่อไม่ให้หายเมื่อ rebuild container
      - itoscon-mssql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: itoscon/Dockerfile
    image: itoscon:latest
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: "Server=db,1433;Database=itoscon;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      # ผู้ดูแลคนแรก (ใช้ได้เฉพาะตอนตารางพนักงานว่าง)
      InitialAdmin__Email: ${INITIAL_ADMIN_EMAIL:-}
      InitialAdmin__Password: ${INITIAL_ADMIN_PASSWORD:-}
      # ใช้ Development สำหรับทดสอบบน http://localhost:8080
      # ถ้าขึ้น production ให้ตั้งเป็น Production และวางหลัง reverse proxy ที่เป็น HTTPS
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  itoscon-mssql:
